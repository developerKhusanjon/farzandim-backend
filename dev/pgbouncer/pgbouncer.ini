; =============================================================================
; Lokal PgBouncer — DigitalOcean "Connection Pools" bilan bir xil rejim.
; Faqat `docker compose --profile pool up -d pgbouncer` bilan ishga tushadi.
;
; Servislar pooler orqali ulanganda JDBC URL'da `prepareThreshold=0` SHART:
; transaction rejimida har tranzaksiya boshqa server ulanishiga tushishi
; mumkin, server tomonidagi prepared statement esa ulanishga bog'langan.
;   DB_URL=jdbc:postgresql://localhost:6432/farzandim_admin?stringtype=unspecified&prepareThreshold=0
;
; Migratsiya (Flyway) pooler orqali EMAS — to'g'ridan-to'g'ri 5432/5442 ga.
; =============================================================================

[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
; Serverdagi ulanishlar: har (baza, rol) juftiga
default_pool_size = 6
reserve_pool_size = 2
max_client_conn = 300
; Ulanish chegarasi bilan mos: bitta rol serverda shundan ko'p ulanish ochmaydi
max_user_connections = 10

; pgjdbc ulanishda yuboradigan parametrlar — pooler ularni rad etmasin
ignore_startup_parameters = extra_float_digits,options

server_idle_timeout = 300
log_connections = 0
log_disconnections = 0
