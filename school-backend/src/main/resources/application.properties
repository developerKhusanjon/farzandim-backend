# =============================================================================
# Farzandim AI — school-backend (Web CRM: maktab admini + o'qituvchi)
# Port 8081 · auditoriya: farzandim-school
# =============================================================================
quarkus.application.name=farzandim-school-backend
quarkus.http.port=${HTTP_PORT:8081}
quarkus.http.limits.max-body-size=2M

# --- Ma'lumotlar bazasi (DigitalOcean Managed PostgreSQL) --------------------
# stringtype=unspecified — `jsonb` va `inet` ustunlarga matn sifatida yozish
# uchun; PostgreSQL turni o'zi aniqlaydi. Entity'lardagi jsonb maydonlar
# String bo'lgani uchun shu kerak.
#
# Har servis O'Z roli bilan ulanadi (farzandim_school / _mobile / _admin) —
# faqat kerakli jadvallarga huquq (R__app_role_grants.sql). Parolning
# standart qiymati yo'q: production'da DB_PASSWORD berilmasa servis ishga
# tushmaydi. Dev'da rollar V902 dev seed'ida avtomatik yaratiladi.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:farzandim_school}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/farzandim?stringtype=unspecified}
# Hovuz — bitta baza uchala servis uchun. Ulanishlar byudjeti (to'g'ridan-to'g'ri
# ulanishda): school 8 + mobile 8 + admin 3 + migratsiya 1 = 20 < 22
# (DigitalOcean'ning eng kichik tarifi). PgBouncer ortida (DB_URL'da
# `prepareThreshold=0`) bu raqamlarni oshirish mumkin — serverdagi ulanishlar
# sonini pooler cheklaydi. docs/07-backend-architecture.md, 8.5-bo'lim.
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:8}
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.acquisition-timeout=10s
quarkus.datasource.jdbc.idle-removal-interval=5M
quarkus.datasource.jdbc.max-lifetime=30M
# Ulanish 2 daqiqadan ko'p ushlanib qolsa — logda ogohlantirish
# (masalan, tashqi chaqiruv tranzaksiya ichida qolib ketgan bo'lsa).
quarkus.datasource.jdbc.leak-detection-interval=2M

quarkus.hibernate-orm.schema-management.strategy=none
# Dev'da Hibernate sxema tekshiruvi o'chiq: jsonb/inet ustunlar entity'da String
quarkus.hibernate-orm.validate-in-dev-mode=false
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.jdbc.timezone=UTC

# --- Migratsiyalar -----------------------------------------------------------
# Production'da migratsiya — ALOHIDA deploy qadami (scripts/migrate.sh):
# shu artefakt `QUARKUS_INIT_AND_EXIT=true FLYWAY_MIGRATE=true` bilan, sxema
# egasi (DB_MIGRATION_USER) nomidan ishga tushadi, migratsiya qiladi va chiqadi.
# Servislarning o'zi faqat tekshiradi (validate): migratsiya qadami
# o'tkazib yuborilsa — servis ishga tushmaydi, runtime SQL xatosi bo'lmaydi.
#   *:future  — yangi reliz migratsiyasi eski nusxani to'xtatmasin (rolling deploy)
#   *:missing — dev seed'lar (db/seed) bu yerdagi ro'yxatda yo'q
quarkus.flyway.migrate-at-start=${FLYWAY_MIGRATE:false}
quarkus.flyway.validate-at-start=${FLYWAY_VALIDATE:true}
quarkus.flyway.ignore-migration-patterns=*:future,*:missing
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=true

# --- JWT ---------------------------------------------------------------------
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:dev-keys/dev-public-key.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://api.farzandim.uz}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:dev-keys/dev-private-key.pem}
# Boshqa ilova uchun berilgan token bu yerda ishlamaydi:
mp.jwt.verify.audiences=farzandim-school
farzandim.jwt.issuer=${JWT_ISSUER:https://api.farzandim.uz}
farzandim.jwt.audience=farzandim-school
farzandim.jwt.access-ttl-seconds=${JWT_ACCESS_TTL:900}
farzandim.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL:2592000}

# --- Valkey (kesh, limit, lock) ---------------------------------------------
quarkus.redis.hosts=${VALKEY_URL:redis://localhost:6379}
quarkus.redis.timeout=2s

# --- DigitalOcean Spaces -----------------------------------------------------
farzandim.spaces.endpoint=${SPACES_ENDPOINT:https://fra1.digitaloceanspaces.com}
farzandim.spaces.bucket=${SPACES_BUCKET:farzandim-dev}
farzandim.spaces.region=${SPACES_REGION:fra1}
farzandim.spaces.access-key=${SPACES_KEY:}
farzandim.spaces.secret-key=${SPACES_SECRET:}
farzandim.spaces.enabled=${SPACES_ENABLED:false}

# --- AI ----------------------------------------------------------------------
farzandim.ai.enabled=${AI_ENABLED:true}
farzandim.ai.api-key=${ANTHROPIC_API_KEY:}
farzandim.ai.default-model=${AI_MODEL:claude-sonnet-5}
farzandim.ai.deep-model=${AI_DEEP_MODEL:claude-opus-5}
# AI job worker aynan shu servisda ishlaydi (mobile/admin faqat navbatga qo'yadi)
farzandim.ai.worker-enabled=${AI_WORKER:true}
# Fon tozalash ishlari (tasdiqlanmagan yuklamalar) — faqat shu servisda.
farzandim.maintenance.enabled=${MAINTENANCE:true}
farzandim.ai.worker-poll-interval=5s
quarkus.rest-client.claude.url=${CLAUDE_URL:https://api.anthropic.com}
quarkus.rest-client.claude.read-timeout=60000

farzandim.embedding.enabled=${EMBEDDING_ENABLED:false}
farzandim.embedding.api-key=${VOYAGE_API_KEY:}
quarkus.rest-client.voyage.url=${VOYAGE_URL:https://api.voyageai.com}
quarkus.rest-client.voyage.read-timeout=30000

# --- Auth --------------------------------------------------------------------
farzandim.auth.login-attempts-per-minute=${LOGIN_RATE:10}

# --- CORS (web CRM) ----------------------------------------------------------
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5180,http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,X-School-Id,Accept
quarkus.http.cors.access-control-max-age=24H

# --- SMS shlyuzi -------------------------------------------------------------
# provider: log | eskiz | playmobile
# Kalitlar berilmasa provayder avtomatik `log` ga tushadi — servis ishlashda
# davom etadi, SMS esa faqat logga yoziladi.
farzandim.sms.provider=${SMS_PROVIDER:log}
farzandim.sms.originator=${SMS_FROM:4546}
farzandim.sms.daily-limit-per-number=${SMS_DAILY_LIMIT:20}
# Login/parolni SMS bilan yuborish. Standart: yo'q — maktab qog'ozda beradi.
farzandim.sms.send-credentials=${SMS_SEND_CREDENTIALS:false}
farzandim.sms.callback-url=${SMS_CALLBACK_URL:}
farzandim.sms.callback-token=${SMS_CALLBACK_TOKEN:}
farzandim.sms.eskiz.url=${ESKIZ_URL:https://notify.eskiz.uz}
farzandim.sms.eskiz.email=${ESKIZ_EMAIL:}
farzandim.sms.eskiz.password=${ESKIZ_PASSWORD:}
farzandim.sms.playmobile.url=${PLAYMOBILE_URL:https://send.smsxabar.uz}
farzandim.sms.playmobile.login=${PLAYMOBILE_LOGIN:}
farzandim.sms.playmobile.password=${PLAYMOBILE_PASSWORD:}

# --- Push (FCM HTTP v1) ------------------------------------------------------
# provider: log | fcm
# Kalit ikki yo'l bilan: service account JSON fayli yoki alohida o'zgaruvchilar.
farzandim.push.provider=${PUSH_PROVIDER:log}
farzandim.push.fcm.credentials-file=${FCM_CREDENTIALS_FILE:}
farzandim.push.fcm.project-id=${FCM_PROJECT_ID:}
farzandim.push.fcm.client-email=${FCM_CLIENT_EMAIL:}
farzandim.push.fcm.private-key=${FCM_PRIVATE_KEY:}
farzandim.push.fcm.android-channel=${FCM_ANDROID_CHANNEL:farzandim-default}
farzandim.push.fcm.concurrency=${FCM_CONCURRENCY:8}

# --- Email -------------------------------------------------------------------
# provider: log | smtp
# SMTP ulanishi Quarkus Mailer'niki; bu yerda faqat kanal tanlovi va chegara.
farzandim.email.provider=${EMAIL_PROVIDER:log}
farzandim.email.from=${EMAIL_FROM:}
farzandim.email.reply-to=${EMAIL_REPLY_TO:}
farzandim.email.daily-limit-per-address=${EMAIL_DAILY_LIMIT:30}
farzandim.email.signature=${EMAIL_SIGNATURE:Farzandim AI}

quarkus.mailer.from=${MAIL_FROM:Farzandim AI <no-reply@farzandim.uz>}
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
quarkus.mailer.start-tls=${MAIL_START_TLS:REQUIRED}
# mock=true — xat jo'natilmaydi, konsolga chiqadi. Produksiyada false qiling.
quarkus.mailer.mock=${MAIL_MOCK:true}

# --- Kuzatuv -----------------------------------------------------------------
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/docs
quarkus.micrometer.export.prometheus.path=/metrics
quarkus.log.level=INFO
quarkus.log.category."uz.farzandim".level=${LOG_LEVEL:DEBUG}

# --- Konteyner ---------------------------------------------------------------
quarkus.container-image.group=farzandim
quarkus.container-image.name=school-backend
quarkus.native.container-build=true
quarkus.native.additional-build-args=--initialize-at-run-time=uz.farzandim.shared.util.Uuids

# --- Dev profili -------------------------------------------------------------
%dev.farzandim.auth.otp-echo-code=true
%dev.quarkus.flyway.locations=db/migration,db/seed
# Dev qulayligi: school-backend ishga tushganda migratsiya ham qiladi —
# sxema egasi (docker-compose superuser) nomidan; ilova esa o'z roli bilan.
%dev.quarkus.flyway.migrate-at-start=${FLYWAY_MIGRATE:true}
%dev.quarkus.flyway.validate-at-start=false
%dev.quarkus.flyway.username=${DB_MIGRATION_USER:farzandim}
%dev.quarkus.flyway.password=${DB_MIGRATION_PASSWORD:farzandim}
%dev.quarkus.datasource.password=${DB_PASSWORD:farzandim_school_dev}
%dev.quarkus.hibernate-orm.log.sql=true
%dev.farzandim.ai.enabled=${AI_ENABLED:false}

%test.quarkus.flyway.migrate-at-start=true
%test.farzandim.ai.enabled=false

# Eslatma: `schema-management.strategy=validate` bu loyihada ishlamaydi.
# `jsonb`, `inet` va massiv ustunlar entity'da String/Array sifatida turadi
# (JDBC URL'da stringtype=unspecified) — Hibernate validatori ularni
# varchar kutadi va nomuvofiqlik deb hisoblaydi. Sxema haqiqatini
# Flyway migratsiyalari va `scripts/smoke-test.py` tasdiqlaydi.
